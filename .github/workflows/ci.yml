name: ci

# Both platforms build the complete solution and run portable validation tools.
# Windows also runs the full console suite, text-content gate, and PDFium probe.
# Ubuntu runs pinned-font DOCX/PPTX rendering and portable console groups. Other rendering
# suites depend on Windows fonts, and the tracked PDFium binary is win-x64.
# Neither job needs Office/COM, a reference cache, or private cases.
on:
  push:
  pull_request:

env:
  OOXPDF_CI_DOTNET_VERSIONS: |
    10.0.403
    11.0.100-rc.3.26522.148

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      TMP: ${{ github.workspace }}/artifacts/ci-tmp
      TEMP: ${{ github.workspace }}/artifacts/ci-tmp
      TMPDIR: ${{ github.workspace }}/artifacts/ci-tmp
      OOXPDF_CI_TEST_RUNNER: ${{ github.workspace }}/artifacts/ci-candidate/tests/Lokad.OoxPdf.Tests/bin/Release/net11.0/Lokad.OoxPdf.Tests.dll
      OOXPDF_TEST_CLI_ASSEMBLY: ${{ github.workspace }}/artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.Cli.dll
      OOXPDF_TEST_PDF_INSPECTOR: ${{ github.workspace }}/tools/Lokad.OoxPdf.PdfInspect/bin/Release/net11.0/Lokad.OoxPdf.PdfInspect.dll
      OOXPDF_TEST_VISUAL_DIFF: ${{ github.workspace }}/tools/Lokad.OoxPdf.VisualDiff/bin/Release/net11.0/Lokad.OoxPdf.VisualDiff.dll
      OOXPDF_TEST_PDF_RASTERIZER: ${{ github.workspace }}/tools/Lokad.OoxPdf.PdfiumRasterizer/bin/Release/net11.0/Lokad.OoxPdf.PdfiumRasterizer.dll
    steps:
      - uses: actions/checkout@v4
      - name: Prepare owned temporary directory
        run: New-Item -ItemType Directory -Force artifacts/ci-tmp | Out-Null
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.OOXPDF_CI_DOTNET_VERSIONS }}
      - name: Build (Release)
        run: dotnet build Lokad.OoxPdf.slnx -c Release --nologo
      - name: Pin candidate runtime identity
        run: |
          & ./tools/FreezeQualificationArtifact.ps1 -OutputDirectories @{
            'net11.0' = 'artifacts/ci-candidate'
            'net10.0' = 'artifacts/ci-candidate-net10'
          }
      - name: Full console suite (Windows, skip slow)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-tests | Out-Null
          $identityPath = 'artifacts/ci-candidate/identity.json'
          $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
          $runner = $env:OOXPDF_CI_TEST_RUNNER
          $library = Join-Path (Split-Path $runner) 'Lokad.OoxPdf.dll'
          if ($identity.Framework -cne 'net11.0' -or $identity.Revision -cne $env:GITHUB_SHA -or
              (Get-FileHash -LiteralPath $runner).Hash -cne $identity.TestAssemblySha256 -or
              (Get-FileHash -LiteralPath $library).Hash -cne $identity.LibrarySha256) {
            throw 'Frozen console runtime identity differs.'
          }
          $report = 'artifacts/ci-tests/full.json'
          dotnet $runner --skip-slow --report $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{
            Revision = $identity.Revision
            IdentitySha256 = (Get-FileHash -LiteralPath $identityPath).Hash
            ReportSha256 = (Get-FileHash -LiteralPath $report).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath 'artifacts/ci-tests/full-runtime.json' -Encoding utf8
      - name: Portable groups and rendering capabilities (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          & ./tools/RunDocxAffectedTests.ps1 -RunnerPath $env:OOXPDF_CI_TEST_RUNNER -OutputDirectory artifacts/ci-tests/rendering-capabilities -FastGroup api,cli,ooxml,pdf,imaging,fonts,rendering-portable,docx-composition-portable,docx-math-portable,tools -Capability pptx-workbook-source-semantics,pptx-chart-coverage-fallback,docx-static-token-wrapping,composition-independent-records-portable,docx-shared-cell-content-portable,docx-list-number-formats-portable,docx-hidden-break-composition-portable,docx-compressed-display-math-portable,docx-section-start-ownership,docx-keep-chain-admission,docx-ordered-widow-fragments,docx-cell-margin-grid-ownership,docx-note-reference-identity,docx-note-picture-order,docx-autofit-paragraph-insets,docx-picture-placement,pptx-horizontal-polar-frame,docx-mixed-column-flow,docx-natural-comment-fills,docx-natural-body-lines,docx-math-hyperlinks,docx-math-content-controls,docx-math-comment-ranges,docx-math-revision-boundaries,docx-inner-math-bookmarks,docx-math-editing-markers,docx-deleted-math-metadata,docx-note-placement-work,docx-counter-spacing,docx-mixed-picture-ranges,pptx-chart-wide-styles,pptx-chart-global-options,docx-bookmark-ownership,docx-math-source-admission,docx-custom-run-owners,docx-shared-note-admission,docx-generated-note-owners,pptx-chart-axis-selection,pptx-chart-plot-selection,pptx-preset-arc-guides,pptx-picture-blur,pptx-font-identity,pptx-fallback-hyperlinks,pptx-chart-titles,pptx-table-merges-portable,docx-conditional-table-styles,docx-note-list-order,docx-table-style-margins,docx-minimum-navigation,docx-local-minimum-leading,docx-page-print-origins-portable,pptx-chart-oracle-portability,pptx-text-oracle-portability,pptx-layout-oracle-portability,docx-mixed-terminal-portable,pptx-single-category-origin,pptx-numeric-label-direction,pptx-area-legend-paint,pptx-typography-oracle-portability,pptx-highlight-oracle-portability,pptx-scatter-outer-target,pptx-connector-operator-portability,docx-glyphless-anchors,docx-comment-font-oracles,rendering-font-prerequisites,docx-cached-math-results,docx-cached-picture-results,docx-empty-field-results,docx-paragraph-property-math,docx-static-default-distances,docx-paragraph-mark-formatting,docx-paragraph-mark-captions,docx-static-box-table-placement,docx-container-table-grids,docx-fixed-static-frames,docx-floating-nested-table -ExpectedSkip DocxInlineCompositionNoteImageDimensionsAndVerticalFrameMatchOffice,DocxInlineCompositionNoteImagesAndMathSurviveSourceSplitting,DocxInlineCompositionEndnoteRunSplittingRetainsSingleAndRepeatedMath,DocxPictureRevisionBodyCellFramesMatchIndependentWordDimensions,DocxInlineCompositionJustifiedMathMatchesIndependentWord,PptxSyntheticTransparentChartTitleRichRunUsesGlyphOutlinePaths,DocxColumnAdmissionMatchesIndependentWordOrigins,DocxInlineCompositionBodyPageCountersMatchIndependentWordFrames,DocxInlineCompositionBodyPageCountersPreserveSupportedMath,DocxInlinePictureLinksFollowPaintedFramesAndPreserveParentContent,DocxMixedColumnFlowMatchesIndependentWordOrigins,DocxParagraphMarkCaptionsMatchIndependentWordTextAndHorizontalOrigins,DocxParagraphMarkCaptionsMatchIndependentWordVerticalOrigins,DocxParagraphMarkFormattingMatchesIndependentWordOrigins,DocxInlineCompositionNumberingMarkOwnersKeepVisibleContent,DocxInlineCompositionMarkFormattingBalloonsMatchIndependentWord,DocxInlineCompositionNumberedMathPreservesFourStoryContent,DocxSyntheticHeaderReferenceTypesSelectDefaultWhenNoFirstOrEvenSetting,DocxDefaultStaticDistancesMatchIndependentWordMathAndBodyOrigins,DocxInlineCompositionFormattingBalloonDescriptionsMatchIndependentWord,DocxInlineCompositionRunFormattingMathMatchesIndependentWord,DocxInlineCompositionRunFormattingMathPreservesSourceAndMetadata,DocxInlineCompositionRunFormattingRetainsAuthoredInk,DocxParagraphPropertyMathMatchesIndependentWordOrigins,DocxEmptyStoredResultsMatchIndependentWordContentAndOrigins,DocxCachedPictureResultsMatchIndependentWordContentAndOrigins,DocxInlineCompositionPictureFirstTablesUseTheirOwnedTextAnchor,DocxInlineCompositionDisplayImageRowsRetainIndependentOfficeFractionFrames,DocxCachedMathResultsMatchIndependentWordContentAndOrigins,DocxInlineCompositionCachedFieldsMatchIndependentWordOffsets,DocxInlineCompositionCachedFieldsRetainRunSplittingAndFallbacks,DocxInlineCompositionCommentsPreserveMathematicsAndCaptions,DocxInlineCompositionControlRevisionsKeepWordContentAndInk,DocxInlineCompositionEmptyScriptsMatchIndependentWord,DocxInlineCompositionEmptyScriptsKeepMetricOnlyPublication,DocxInnerMathBookmarksMatchIndependentWordViewports,DocxInlineCompositionMathRunRevisionsMatchIndependentWord,DocxInlineCompositionEquationRevisionsMatchIndependentWord,DocxInlineCompositionEmptyFractionsMatchIndependentWord,DocxInlineCompositionMappedNoteBandBottomMatchesIndependentWord,DocxWordCompatibleBalloonHeightFitsWrappedBodyContent,PptxHighlightedHeadlineTextWrapsBeforeFinalWord,PptxHighlightedContinuationEmitsOfficeCharacterSpacingTextStateAcrossAutofitWrap,PptxNumberedAutofitRunSplitUsesContinuationCharacterSpacingTextState,PptxTextOfficeTrailingEmphasisRunOwnsLineEndGlyphOperation,PptxTextManualBreakSameStyleLineCoalesces,PptxSyntheticChartAxisTickLabelOptionsRender,DocxMinimumPaintFramesMatchWord,DocxLocalMinimumLeadingFramesMatchWord,DocxMinimumNavigationFramesMatchWord,DocxIndentedTablePinsTextAtIndentOrigin,DocxCompatGridAlignsOuterBorderAtMargin,DocxCompatIndentAlignsOuterBorderAtIndentedMargin,DocxStyleMarginsPinTextAtMarginWithoutCompat,DocxDirectMarginsReplaceStyleMarginsForTextOffset,DocxTableNormalMissingCellMarginsFallBackToBuiltIn,DocxMathHyperlinksMatchIndependentRootLineRectangles,DocxStaticBoxTablesKeepIndependentWordVerticalOrigins,DocxInlineBoxMathKeepsIndependentContentAcrossContainers,DocxInlineBoxPageCountersKeepIndependentWordMathAndFieldOrigins,DocxInlineCompositionStaticSourceFramesMatchIndependentWord,DocxOrdinaryStaticInlineOriginsMatchIndependentWord,DocxStaticTableMathAndPlainFramesMatchIndependentWordAnchors,DocxStaticTableMathCompleteReportMatchesIndependentPrintedFrames,DocxStaticTableOriginsMatchIndependentWordContentAndGeometry,DocxAuthoredTableMarginsKeepIndependentBorderedWordOrigins,DocxAuthoredZeroTableIndentsKeepIndependentWordAnchors,DocxContainerTableGridsMatchIndependentWordHorizontalOriginsAndNestedOffsets,DocxInlineCompositionNestedBorderPitchMatchesIndependentWordHeightAndFollowingFlow,DocxInlineCompositionNestedCellNeighborsKeepIndependentContentAndFinalVerticalPlacement,DocxInlineCompositionNestedMathKeepsIndependentContentAcrossContainersAndTransformations,DocxInlineCompositionNestedMathStaticFramesMatchIndependentVisibleWordOrigins,DocxInlineCompositionSignedTableIndentsMatchIndependentWord,DocxInlineCompositionTableGridOriginsMatchIndependentWord,DocxFixedStaticFramesMatchIndependentWordOriginsAndBoxFrames,DocxNaturalBodyLinesMatchIndependentWordOriginsInFinalAndReview,DocxStaticPictureLinksReuseIndependentCompoundFrames,DocxInlineCompositionExactCommentFramesMatchIndependentWordVerticalBounds,DocxSyntheticExactLineHeightPositionsNextParagraph,DocxSyntheticParagraphKeepLinesStartsBlockOnNextPage,DocxSyntheticParagraphKeepNextMovesPairToNextPage,DocxSyntheticParagraphKeepNextChainsAcrossConsecutiveParagraphsToNextPage,DocxNaturalCommentFillsMatchIndependentWordSourceAndLineBounds
      - name: Visual manifest gate
        run: pwsh -NoProfile -File tools/ValidateVisualCases.ps1
      - name: Qualification capability catalog gate
        run: |
          $capabilities = Get-Content tools/qualification-capabilities.json -Raw | ConvertFrom-Json -AsHashtable
          & ./tools/RunDocxAffectedTests.ps1 -RunnerPath $env:OOXPDF_CI_TEST_RUNNER -OutputDirectory artifacts/ci-tests/capability-catalog -Capability @($capabilities.Keys) -ListOnly
      - name: Frozen visual family binding checks
        run: |
          pwsh -NoProfile -File tools/TestVisualFamilyBinding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestFrozenMarkupBinding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestCliDiagnosticsPublication.ps1 -CliPath artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.Cli.dll
      - name: PPTX source inventory ownership
        run: pwsh -NoProfile -File tools/TestPptxSourceInventory.ps1 -InspectorPath tools/Lokad.OoxPdf.PptxInspect/bin/Release/net11.0/Lokad.OoxPdf.PptxInspect.dll
      - name: Text content gate
        if: runner.os == 'Windows'
        run: |
          & ./tools/TestTextContentCases.ps1
          & ./tools/CheckPdfTextContent.ps1 -CliPath artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.Cli.dll -InspectorPath tools/Lokad.OoxPdf.PdfInspect/bin/Release/net11.0/Lokad.OoxPdf.PdfInspect.dll -SkipBuild
      - name: Raster wrapper paths and failures
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tools/TestRasterizePdfPaths.ps1 -RasterizerPath tools/Lokad.OoxPdf.PdfiumRasterizer/bin/Release/net11.0/Lokad.OoxPdf.PdfiumRasterizer.dll
      - name: Allocation probe self-test
        run: >-
          pwsh -NoProfile -File tools/NewFrozenAllocationRuntime.ps1
          -ArtifactDirectory artifacts/ci-candidate -OutputDirectory artifacts/ci-tests/allocation-probe
          -ProbePath tools/Lokad.OoxPdf.AllocProbe/bin/Release/net11.0/Lokad.OoxPdf.AllocProbe.dll
      - name: .NET 10 compatibility checks
        run: |
          $env:OOXPDF_TEST_CLI_ASSEMBLY = "$env:GITHUB_WORKSPACE/artifacts/ci-candidate-net10/src/Lokad.OoxPdf.Cli/bin/Release/net10.0/Lokad.OoxPdf.Cli.dll"
          & ./tools/RunDocxAffectedTests.ps1 -RunnerPath artifacts/ci-candidate-net10/tests/Lokad.OoxPdf.Tests/bin/Release/net10.0/Lokad.OoxPdf.Tests.dll -OutputDirectory artifacts/ci-tests/net10 -Capability framework-compatibility -ExpectedSkip ConvertReplacesSymbolicLinkDestinationWithoutChangingInput,ConvertRejectsLinkedInputReferentDestinations
      - name: Package smoke tests (one package, both frameworks)
        if: runner.os == 'Windows'
        run: |
          dotnet pack src/Lokad.OoxPdf/Lokad.OoxPdf.csproj -c Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$project = Get-Content src/Lokad.OoxPdf/Lokad.OoxPdf.csproj
          $package = "artifacts/nuget/Lokad.OoxPdf.$($project.Project.PropertyGroup.Version).nupkg"
          $frameworks = @('net11.0','net10.0')
          $hashes = @(foreach ($framework in $frameworks) {
            $directory = if ($framework -eq 'net11.0') { 'artifacts/ci-candidate' } else { 'artifacts/ci-candidate-net10' }
            $identity = Get-Content -LiteralPath "$directory/identity.json" -Raw | ConvertFrom-Json
            if ($identity.Framework -cne $framework -or $identity.Revision -cne $env:GITHUB_SHA) {
              throw "Frozen package runtime identity differs for $framework."
            }
            $identity.LibrarySha256
          })
          & ./tools/TestPackageSmoke.ps1 -PackagePath $package -Framework $frameworks -ExpectedLibrarySha256 $hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package consumer cleanup checks
        run: pwsh -NoProfile -File tools/TestPackageConsumerCleanup.ps1
      - name: Text comparison adversarial checks
        run: |
          pwsh -NoProfile -File tools/TestTextOperationComparison.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestTextLineStarts.ps1
      - name: Qualification fixture snapshot checks
        run: |
          pwsh -NoProfile -File tools/TestQualificationFreeze.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestZipPackage.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestWorkspaceFootprint.ps1
      - name: Qualification build workspace checks
        run: |
          pwsh -NoProfile -File tools/TestQualificationBuild.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestBuildIsolation.ps1
      - name: Qualification report reuse checks
        run: pwsh -NoProfile -File tools/TestQualificationReportJoin.ps1
      - name: Qualification transfer ownership checks
        run: pwsh -NoProfile -File tools/TestQualificationTransfer.ps1
      - name: Reference and affected-report mechanics
        run: |
          pwsh -NoProfile -File tools/TestOfficeReferenceOwnership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestOfficeImageReference.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestReferenceDerivative.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestDocxMarkupReferenceIdentity.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestReferenceWorkerPaths.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestAffectedTestReporting.ps1
      - name: Markup text geometry checks
        run: pwsh -NoProfile -File tools/TestMarkupTextGeometry.ps1
      - name: Markup annotation checks
        run: pwsh -NoProfile -File tools/TestMarkupAnnotations.ps1
      - name: Graphics comparison adversarial checks
        run: pwsh -NoProfile -File tools/TestGraphicsOperationComparison.ps1
      - name: Visual report comparison checks
        run: pwsh -NoProfile -File tools/TestVisualReportComparison.ps1
      - name: Emission comparison adversarial checks
        run: pwsh -NoProfile -File tools/TestPptxEmissionComparison.ps1
      - name: Content tokenization checks
        run: pwsh -NoProfile -File tools/TestPdfContentTokenization.ps1 -InspectorPath $env:OOXPDF_TEST_PDF_INSPECTOR
      - name: Composition source audit checks
        run: |
          $python = 'python3'
          if ($IsWindows) {
            python -m venv artifacts/ci-tmp/native-content
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $python = (Resolve-Path artifacts/ci-tmp/native-content/Scripts/python.exe).Path
            & $python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-deps PyMuPDF==1.28.2 fonttools==4.66.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $python -B tools/TestCompositionSourceAudit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            & $python -B tools/TestPdfInk.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -B tools/TestInlineFrameGeometry.py --output-directory artifacts/ci-tests/inline-frame-geometry
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Composition comparison orchestration checks
        run: |
          pwsh -NoProfile -File tools/TestCompositionMeasurement.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestCompositionComparison.ps1 -OutputDirectory artifacts/ci-tests/composition-comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestCompositionJoin.ps1
      - name: Composition reference view checks
        run: pwsh -NoProfile -File tools/TestCompositionReferences.ps1
      - name: Chart classifier adversarial checks
        run: pwsh -NoProfile -File tools/TestChartClassifierRobustness.ps1
      - name: Publish console test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-tests-${{ matrix.os }}
          path: |
            artifacts/ci-tests/**/*.json
            !artifacts/ci-tests/**/temporary-files/**
      - name: Retain candidate runtime and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            artifacts/ci-candidate/identity.json
            artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/*
            !artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.pdb
            artifacts/ci-candidate-net10/identity.json
            artifacts/ci-candidate-net10/src/Lokad.OoxPdf.Cli/bin/Release/net10.0/*
            !artifacts/ci-candidate-net10/src/Lokad.OoxPdf.Cli/bin/Release/net10.0/Lokad.OoxPdf.pdb
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/package-smoke/**/summary.json

  ubuntu-package:
    name: Package consumer (ubuntu-latest)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      TMP: ${{ github.workspace }}/artifacts/ci-tmp
      TEMP: ${{ github.workspace }}/artifacts/ci-tmp
      TMPDIR: ${{ github.workspace }}/artifacts/ci-tmp
    steps:
      - uses: actions/checkout@v4
      - name: Prepare owned temporary directory
        run: New-Item -ItemType Directory -Force artifacts/ci-tmp | Out-Null
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.OOXPDF_CI_DOTNET_VERSIONS }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-windows-latest
          path: artifacts/windows-candidate
      - name: Consume the exact Windows package on Ubuntu
        run: |
          $transfer = 'artifacts/windows-candidate'
          $packages = @(Get-ChildItem -LiteralPath "$transfer/nuget" -Filter 'Lokad.OoxPdf.*.nupkg' -File)
          if ($packages.Count -ne 1) { throw 'Expected one canonical Windows package.' }
          $package = $packages[0].FullName
          $packageHash = (Get-FileHash -LiteralPath $package).Hash
          $summaries = @(Get-ChildItem -LiteralPath "$transfer/package-smoke" -Filter 'summary.json' -File -Recurse |
            ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json } |
            Where-Object ReusedPackage -EQ $true)
          $frameworks = @('net11.0','net10.0')
          if ($summaries.Count -ne $frameworks.Count) { throw 'Expected one Windows consumer summary per framework.' }
          $hashes = @(foreach ($framework in $frameworks) {
            $directory = if ($framework -eq 'net11.0') { 'ci-candidate' } else { 'ci-candidate-net10' }
            $identity = Get-Content -LiteralPath "$transfer/$directory/identity.json" -Raw | ConvertFrom-Json
            $summary = @($summaries | Where-Object Framework -CEQ $framework)
            if ($identity.Revision -cne $env:GITHUB_SHA -or $identity.Framework -cne $framework -or
                $summary.Count -ne 1 -or $summary[0].PackageSha256 -cne $packageHash -or
                $summary[0].RestoredPackageSha256 -cne $packageHash -or
                $summary[0].LibrarySha256 -cne $identity.LibrarySha256) {
              throw "Windows package identity mismatch for $framework."
            }
            $identity.LibrarySha256
          })
          & ./tools/TestPackageSmoke.ps1 -PackagePath $package -Framework $frameworks -ExpectedLibrarySha256 $hashes `
              -FontPath tests/Lokad.OoxPdf.Tests/Cases/PortableFonts/DejaVuSans.ttf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/TestPackageInspection.ps1 -PackagePath $package -OutputDirectory artifacts/ci-tests/package-inspection
      - name: Retain Ubuntu package consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-ubuntu-latest
          retention-days: 7
          path: |
            artifacts/package-smoke/**/summary.json
            artifacts/ci-tests/package-inspection/**/*.json
