name: ci

# Both platforms build the complete solution and run portable validation tools.
# Windows also runs the full console suite, text-content gate, and PDFium probe.
# Ubuntu runs pinned-font DOCX/PPTX rendering and portable console groups. Other rendering
# suites depend on Windows fonts, and the tracked PDFium binary is win-x64.
# Neither job needs Office/COM, a reference cache, or private cases.
on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      TMP: ${{ github.workspace }}/artifacts/ci-tmp
      TEMP: ${{ github.workspace }}/artifacts/ci-tmp
      OOXPDF_TEST_CLI_ASSEMBLY: ${{ github.workspace }}/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.Cli.dll
      OOXPDF_TEST_PDF_INSPECTOR: ${{ github.workspace }}/tools/Lokad.OoxPdf.PdfInspect/bin/Release/net11.0/Lokad.OoxPdf.PdfInspect.dll
      OOXPDF_TEST_VISUAL_DIFF: ${{ github.workspace }}/tools/Lokad.OoxPdf.VisualDiff/bin/Release/net11.0/Lokad.OoxPdf.VisualDiff.dll
      OOXPDF_TEST_PDF_RASTERIZER: ${{ github.workspace }}/tools/Lokad.OoxPdf.PdfiumRasterizer/bin/Release/net11.0/Lokad.OoxPdf.PdfiumRasterizer.dll
    steps:
      - uses: actions/checkout@v4
      - name: Prepare owned temporary directory
        run: New-Item -ItemType Directory -Force artifacts/ci-tmp | Out-Null
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.403
            11.0.100-rc.3.26522.148
      - name: Install font for Ubuntu package smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core
      - name: Build (Release)
        run: dotnet build Lokad.OoxPdf.slnx -c Release --nologo
      - name: Pin candidate runtime identity
        run: |
          pwsh -NoProfile -File tools/FreezeQualificationArtifact.ps1 -OutputDirectory artifacts/ci-candidate -Framework net11.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/FreezeQualificationArtifact.ps1 -OutputDirectory artifacts/ci-candidate-net10 -Framework net10.0
      - name: Full console suite (Windows, skip slow)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-tests | Out-Null
          dotnet run --no-build --project tests/Lokad.OoxPdf.Tests -c Release -f net11.0 -- --skip-slow --report artifacts/ci-tests/full.json
      - name: Portable groups and rendering capabilities (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          & ./tools/RunDocxAffectedTests.ps1 -RunnerPath tests/Lokad.OoxPdf.Tests/bin/Release/net11.0/Lokad.OoxPdf.Tests.dll -OutputDirectory artifacts/ci-tests/rendering-capabilities -FastGroup api,cli,ooxml,pdf,imaging,fonts,rendering-portable -Capability docx-autofit-paragraph-insets,docx-picture-placement,pptx-horizontal-polar-frame,docx-mixed-column-flow,docx-natural-comment-fills,docx-natural-body-lines,docx-math-hyperlinks,docx-math-content-controls,docx-math-comment-ranges,docx-math-revision-boundaries,docx-inner-math-bookmarks,docx-math-editing-markers,docx-deleted-math-metadata,docx-note-placement-work,docx-counter-spacing,docx-navigation-spacing,docx-mixed-picture-ranges,pptx-chart-wide-styles,pptx-chart-global-options,docx-bookmark-ownership,docx-math-source-admission,docx-custom-run-owners,docx-shared-note-admission,docx-generated-note-owners,pptx-chart-axis-selection,pptx-chart-plot-selection,pptx-preset-arc-guides,pptx-picture-blur,pptx-font-identity,pptx-fallback-hyperlinks,pptx-chart-titles,pptx-table-merges-portable,docx-conditional-table-styles,docx-note-list-order,docx-table-style-margins,docx-minimum-navigation,docx-minimum-paint,docx-local-minimum-leading,docx-page-print-origins-portable,pptx-chart-oracle-portability,pptx-text-oracle-portability,pptx-layout-oracle-portability,docx-mixed-terminal-portable,pptx-single-category-origin,pptx-numeric-label-direction,pptx-right-legend-admission,pptx-side-legend-line-box,pptx-area-legend-paint,pptx-typography-oracle-portability,pptx-highlight-oracle-portability,pptx-scatter-outer-target,pptx-connector-operator-portability,docx-glyphless-anchors,docx-comment-font-oracles,rendering-font-prerequisites,docx-cached-math-results,docx-cached-picture-results,docx-empty-field-results,docx-paragraph-property-math,docx-static-default-distances,docx-paragraph-mark-formatting,docx-paragraph-mark-captions,docx-static-box-table-placement,docx-container-table-grids,docx-fixed-static-frames,docx-cell-counter-memo-portable,docx-floating-nested-table -ExpectedSkip DocxPictureRevisionBodyCellFramesMatchIndependentWordDimensions,DocxInlineCompositionJustifiedMathMatchesIndependentWord,PptxSyntheticTransparentChartTitleRichRunUsesGlyphOutlinePaths,PptxSyntheticChartStyleTitleAlphaUsesGlyphOutlinePaths,DocxColumnAdmissionMatchesIndependentWordOrigins,DocxInlineCompositionBodyPageCountersMatchIndependentWordFrames,DocxInlineCompositionBodyPageCountersPreserveSupportedMath,DocxInlinePictureLinksFollowPaintedFramesAndPreserveParentContent,DocxMixedColumnFlowMatchesIndependentWordOrigins,DocxParagraphMarkCaptionsMatchIndependentWordTextAndHorizontalOrigins,DocxParagraphMarkCaptionsMatchIndependentWordVerticalOrigins,DocxParagraphMarkFormattingMatchesIndependentWordOrigins,DocxInlineCompositionNumberingMarkOwnersKeepVisibleContent,DocxInlineCompositionMarkFormattingBalloonsMatchIndependentWord,DocxInlineCompositionNumberedMathPreservesFourStoryContent,DocxSyntheticHeaderAndFooterRenderOnPage,DocxSyntheticHeaderReferenceTypesSelectDefaultWhenNoFirstOrEvenSetting,DocxSyntheticHeaderFooterDistancesUsePageMarginTokens,DocxSyntheticSectionHeadersUsePageLocalGeometry,DocxSyntheticSectionHeadersDoNotBackfillEarlierSectionsFromFinalReferences,DocxDefaultStaticDistancesMatchIndependentWordMathAndBodyOrigins,DocxInlineCompositionFormattingBalloonDescriptionsMatchIndependentWord,DocxInlineCompositionRunFormattingMathMatchesIndependentWord,DocxInlineCompositionRunFormattingMathPreservesSourceAndMetadata,DocxInlineCompositionRunFormattingRetainsAuthoredInk,DocxParagraphPropertyMathMatchesIndependentWordOrigins,DocxEmptyStoredResultsMatchIndependentWordContentAndOrigins,DocxCachedPictureResultsMatchIndependentWordContentAndOrigins,DocxInlineCompositionPictureFirstTablesUseTheirOwnedTextAnchor,DocxInlineCompositionDisplayImageRowsRetainIndependentOfficeFractionFrames,DocxCachedMathResultsMatchIndependentWordContentAndOrigins,DocxInlineCompositionCachedFieldsMatchIndependentWordOffsets,DocxInlineCompositionCachedFieldsRetainRunSplittingAndFallbacks,DocxInlineCompositionCommentsPreserveMathematicsAndCaptions,DocxInlineCompositionControlRevisionsKeepWordContentAndInk,DocxInlineCompositionEmptyScriptsMatchIndependentWord,DocxInlineCompositionEmptyScriptsKeepMetricOnlyPublication,DocxInnerMathBookmarksMatchIndependentWordViewports,DocxInlineCompositionMathRunRevisionsMatchIndependentWord,DocxInlineCompositionEquationRevisionsMatchIndependentWord,DocxInlineCompositionEmptyFractionsMatchIndependentWord,DocxInlineCompositionMappedNoteBandBottomMatchesIndependentWord,DocxWordCompatibleBalloonHeightFitsWrappedBodyContent,PptxHighlightedHeadlineTextWrapsBeforeFinalWord,PptxHighlightedContinuationEmitsOfficeCharacterSpacingTextStateAcrossAutofitWrap,PptxNumberedAutofitRunSplitUsesContinuationCharacterSpacingTextState,PptxTextOfficeTrailingEmphasisRunOwnsLineEndGlyphOperation,PptxTextManualBreakSameStyleLineCoalesces,PptxSyntheticChartAxisTickLabelOptionsRender,DocxMinimumBookmarksMatchIndependentWordBaselinesAndPageFrames,DocxIndentedTablePinsTextAtIndentOrigin,DocxCompatGridAlignsOuterBorderAtMargin,DocxCompatIndentAlignsOuterBorderAtIndentedMargin,DocxStyleMarginsPinTextAtMarginWithoutCompat,DocxDirectMarginsReplaceStyleMarginsForTextOffset,DocxTableNormalMissingCellMarginsFallBackToBuiltIn,DocxMathHyperlinksMatchIndependentRootLineRectangles,DocxStaticBoxTablesKeepIndependentWordVerticalOrigins,DocxInlineBoxMathKeepsIndependentContentAcrossContainers,DocxInlineBoxPageCountersKeepIndependentWordMathAndFieldOrigins,DocxInlineCompositionStaticSourceFramesMatchIndependentWord,DocxOrdinaryStaticInlineOriginsMatchIndependentWord,DocxStaticTableMathAndPlainFramesMatchIndependentWordAnchors,DocxStaticTableMathCompleteReportMatchesIndependentPrintedFrames,DocxStaticTableOriginsMatchIndependentWordContentAndGeometry,DocxAuthoredTableMarginsKeepIndependentBorderedWordOrigins,DocxAuthoredZeroTableIndentsKeepIndependentWordAnchors,DocxContainerTableGridsMatchIndependentWordHorizontalOriginsAndNestedOffsets,DocxInlineCompositionNestedBorderPitchMatchesIndependentWordHeightAndFollowingFlow,DocxInlineCompositionNestedCellNeighborsKeepIndependentContentAndFinalVerticalPlacement,DocxInlineCompositionNestedMathKeepsIndependentContentAcrossContainersAndTransformations,DocxInlineCompositionNestedMathStaticFramesMatchIndependentVisibleWordOrigins,DocxInlineCompositionSignedTableIndentsMatchIndependentWord,DocxInlineCompositionTableGridOriginsMatchIndependentWord,DocxFixedStaticFramesMatchIndependentWordOriginsAndBoxFrames,DocxNaturalBodyLinesMatchIndependentWordOriginsInFinalAndReview,DocxStaticPictureLinksReuseIndependentCompoundFrames,DocxInlineCompositionExactCommentFramesMatchIndependentWordVerticalBounds,DocxSyntheticExactLineHeightPositionsNextParagraph,DocxSyntheticParagraphKeepLinesStartsBlockOnNextPage,DocxSyntheticParagraphKeepNextMovesPairToNextPage,DocxSyntheticParagraphKeepNextChainsAcrossConsecutiveParagraphsToNextPage,DocxSyntheticParagraphWidowControlMovesThreeLineParagraphToNextPage,DocxSyntheticParagraphDefaultWidowControlMovesThreeLineParagraphToNextPage,DocxNaturalCommentFillsMatchIndependentWordSourceAndLineBounds
      - name: Visual manifest gate
        run: pwsh -NoProfile -File tools/ValidateVisualCases.ps1
      - name: Qualification capability catalog gate
        run: |
          $capabilities = Get-Content tools/qualification-capabilities.json -Raw | ConvertFrom-Json -AsHashtable
          & ./tools/RunDocxAffectedTests.ps1 -RunnerPath tests/Lokad.OoxPdf.Tests/bin/Release/net11.0/Lokad.OoxPdf.Tests.dll -OutputDirectory artifacts/ci-tests/capability-catalog -Capability @($capabilities.Keys) -ListOnly
      - name: Frozen visual family binding checks
        run: |
          pwsh -NoProfile -File tools/TestVisualFamilyBinding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestFrozenMarkupBinding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestCliDiagnosticsPublication.ps1 -CliPath artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.Cli.dll
      - name: Text content gate
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File tools/CheckPdfTextContent.ps1 -CliPath artifacts/ci-candidate/src/Lokad.OoxPdf.Cli/bin/Release/net11.0/Lokad.OoxPdf.Cli.dll -InspectorPath tools/Lokad.OoxPdf.PdfInspect/bin/Release/net11.0/Lokad.OoxPdf.PdfInspect.dll -SkipBuild
      - name: Raster wrapper paths and failures
        if: runner.os == 'Windows'
        run: |
          $pdf = Get-ChildItem artifacts/text-content -Recurse -Filter output.pdf -File | Select-Object -First 1
          & ./tools/TestRasterizePdfPaths.ps1 -InputPdf $pdf.FullName -RasterizerPath tools/Lokad.OoxPdf.PdfiumRasterizer/bin/Release/net11.0/Lokad.OoxPdf.PdfiumRasterizer.dll
      - name: Allocation probe self-test
        run: pwsh -NoProfile -File tools/NewFrozenAllocationRuntime.ps1 -ArtifactDirectory artifacts/ci-candidate -OutputDirectory artifacts/ci-allocation-probe
      - name: .NET 10 compatibility checks
        run: |
          $env:OOXPDF_TEST_CLI_ASSEMBLY = "$env:GITHUB_WORKSPACE/artifacts/ci-candidate-net10/src/Lokad.OoxPdf.Cli/bin/Release/net10.0/Lokad.OoxPdf.Cli.dll"
          & ./tools/RunDocxAffectedTests.ps1 -RunnerPath artifacts/ci-candidate-net10/tests/Lokad.OoxPdf.Tests/bin/Release/net10.0/Lokad.OoxPdf.Tests.dll -OutputDirectory artifacts/ci-tests/net10 -Capability framework-compatibility -ExpectedSkip ConvertReplacesSymbolicLinkDestinationWithoutChangingInput,ConvertRejectsLinkedInputReferentDestinations
      - name: Package smoke tests (one package, both frameworks)
        run: |
          dotnet pack src/Lokad.OoxPdf/Lokad.OoxPdf.csproj -c Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$project = Get-Content src/Lokad.OoxPdf/Lokad.OoxPdf.csproj
          $package = "artifacts/nuget/Lokad.OoxPdf.$($project.Project.PropertyGroup.Version).nupkg"
          $fontArguments = @{}
          if ($IsLinux) { $fontArguments.FontPath = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf' }
          foreach ($framework in @('net11.0','net10.0')) {
            $hash = (Get-FileHash "src/Lokad.OoxPdf/bin/Release/$framework/Lokad.OoxPdf.dll").Hash
            & ./tools/TestPackageSmoke.ps1 -PackagePath $package -Framework $framework -ExpectedLibrarySha256 $hash @fontArguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & ./tools/TestPackageInspection.ps1 -PackagePath $package -OutputDirectory artifacts/ci-tests/package-inspection
      - name: Text comparison adversarial checks
        run: |
          pwsh -NoProfile -File tools/TestTextOperationComparison.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestTextLineStarts.ps1
      - name: Qualification fixture snapshot checks
        run: |
          pwsh -NoProfile -File tools/TestQualificationFreeze.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestWorkspaceFootprint.ps1
      - name: Qualification build workspace checks
        run: |
          pwsh -NoProfile -File tools/TestQualificationBuild.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestBuildIsolation.ps1
      - name: Qualification report reuse checks
        run: pwsh -NoProfile -File tools/TestQualificationReportJoin.ps1
      - name: Qualification transfer ownership checks
        run: pwsh -NoProfile -File tools/TestQualificationTransfer.ps1
      - name: Reference and affected-report mechanics
        run: |
          pwsh -NoProfile -File tools/TestOfficeReferenceOwnership.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestOfficeImageReference.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestReferenceDerivative.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestReferenceWorkerPaths.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestAffectedTestReporting.ps1
      - name: Markup text geometry checks
        run: pwsh -NoProfile -File tools/TestMarkupTextGeometry.ps1
      - name: Markup annotation checks
        run: pwsh -NoProfile -File tools/TestMarkupAnnotations.ps1
      - name: Graphics comparison adversarial checks
        run: pwsh -NoProfile -File tools/TestGraphicsOperationComparison.ps1
      - name: Visual report comparison checks
        run: pwsh -NoProfile -File tools/TestVisualReportComparison.ps1
      - name: Flow comparison adversarial checks
        run: pwsh -NoProfile -File tools/TestFlowComparison.ps1
      - name: Emission comparison adversarial checks
        run: pwsh -NoProfile -File tools/TestPptxEmissionComparison.ps1
      - name: Content tokenization checks
        run: pwsh -NoProfile -File tools/TestPdfContentTokenization.ps1
      - name: Composition source audit checks
        run: python -B tools/TestCompositionSourceAudit.py
      - name: Composition comparison orchestration checks
        run: |
          pwsh -NoProfile -File tools/TestCompositionMeasurement.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestCompositionComparison.ps1 -OutputDirectory artifacts/ci-tests/composition-comparison
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestCompositionJoin.ps1
      - name: Composition reference view checks
        run: pwsh -NoProfile -File tools/TestCompositionReferences.ps1
      - name: Chart classifier adversarial checks
        run: |
          pwsh -NoProfile -File tools/TestChartClassifierRobustness.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tools/TestChartSummaryCoverage.ps1 -InspectorPath tools/Lokad.OoxPdf.PdfInspect/bin/Release/net11.0/Lokad.OoxPdf.PdfInspect.dll
      - name: Portable VisualDiff metric probe
        if: runner.os == 'Linux'
        run: dotnet run --no-build --project tests/Lokad.OoxPdf.Tests -c Release -f net11.0 -- --test VisualDiffForegroundRecallCoversSparseBlankAndRegionCases --report artifacts/ci-tests/visual-metrics.json
      - name: Publish console test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-tests-${{ matrix.os }}
          path: |
            artifacts/ci-tests/**/*.json
            !artifacts/ci-tests/**/temporary-files/**
      - name: Retain candidate runtime and package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            artifacts/ci-candidate/identity.json
            artifacts/ci-candidate/**/bin/Release/net11.0/*
            artifacts/ci-candidate-net10/identity.json
            artifacts/ci-candidate-net10/**/bin/Release/net10.0/*
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/package-smoke/**/summary.json
